# One-click deploy on Render (https://render.com): gives NeuroMap a real https:// URL
services:
  - type: web
    name: neuromap
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python -c "from neuromap import demo; demo.seed()"
    startCommand: uvicorn neuromap.api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
